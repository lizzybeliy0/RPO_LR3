version: '3.8'

services:
  transport-api:
    build: .
    container_name: transport-cards-api
    ports:
      - "8888:8888"
    volumes:
      - transport-data:/app/data
    environment:
      - DB_PATH=/app/data/transport.db
      - PORT=8080
    restart: unless-stopped

volumes:
  transport-data:
